server:
  port: ${application.server.port}
spring:
  profiles:
    active:
      - spring-cloud
      - cors
      - keycloak
      - ${application.vendor.database}
      - ${application.vendor.messaging}

application:
  name: user-api
  server:
    context-path: /api/user
    port: ${USER_SERVER_PORT:8080}
  vendor:
    database: ${USER_VENDOR_DATABASE:postgres} # h2 | postgres
    messaging: ${USER_VENDOR_MESSAGING:rabbitmq} # rabbitmq
  messaging:
    consumer:
      user-created-event:
        concurrency: ${USER_MESSAGING_CONSUMER_USER_CREATED_EVENT_CONCURRENCY:1}
        max-attempts: ${USER_MESSAGING_CONSUMER_USER_CREATED_EVENT_MAX_ATTEMPTS:5}
